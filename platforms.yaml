   # Shareable: does not include the intel libary in final image
   # includes intel25 --> supports ifx (ifort no longer suppported in intel24 and above)
   - name: hpcme.intel25
     compiler: intel
     RUNenv: ""
     modelRoot: /apps
     container: True
     containerBuild: "podman"
     containerRun: "apptainer"
     containerBase: "gitlab-registry.gfdl.noaa.gov:443/fre/hpc-me/base-ubuntu24.04-intel:2025.3"
     mkTemplate: "/apps/mkmf/templates/hpcme-intel2025.03-oneapi.mk"
     container2step: True
     container2base: "gitlab-registry.gfdl.noaa.gov:443/fre/hpc-me/base-ubuntu24.04-intel:2025.3rte"
     volume: "{{ fre_properties.VOLUME }}" # or /gpfs/f6 depending on where you are working


     #### USED IN FRE-CLI TESTING ####
   - name: ci.gnu
     compiler: gnu
     mkTemplate: /__w/fre-cli/fre-cli/mkmf/templates/linux-ubuntu-xenial-gnu.mk
     modelRoot: ${TEST_BUILD_DIR}/fremake_2025/test
     
     #### AMD ####
   - name: amd.inteloneapi
     compiler: intel
     envSetup: ["module load oneapi/2024.2",
                "module load compiler/2024.2.0",
                "module load mpi",
                "module load netcdf/4.9.2",
                "module load hdf5/1.14.5",
                "module load libyaml/0.2.5"]
     mkTemplate: /home/Lauren.Chilutti/mkmf/templates/amd-intel-oneapi.mk
     modelRoot: ${HOME}/fremake_2025/test
