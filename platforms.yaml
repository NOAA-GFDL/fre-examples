platforms:
   - name: ncrc5.intel23
     compiler: intel
     envSetup: ["module use -a /ncrc/home2/fms/local/modulefiles",
                "source $MODULESHOME/init/sh",
                "module load {{ fre_properties.INTEL }}/2023.2.0",
                "module load cray-hdf5/1.12.2.11",
                "module load cray-netcdf/4.9.0.11",
                "module unload cray-libsci/25.03.0"]
     mkTemplate: "/ncrc/home2/fms/local/opt/fre-commands/bronx-20/site/ncrc5/{{ fre_properties.INTEL }}.mk"
     modelRoot: ${HOME}/fremake_2025/c5_test
   
   - name: ncrc6.intel23
     compiler: intel
     envSetup: ["module use -a /ncrc/home2/fms/local/modulefiles",
                "source $MODULESHOME/init/sh",
                "module load {{ fre_properties.INTEL }}/2023.2.0",
                "module load cray-hdf5/1.12.2.11",
                "module load cray-netcdf",
                "module load cray-libsci/24.07.0"]
     mkTemplate: "/ncrc/home2/fms/local/opt/fre-commands/bronx-23/site/ncrc6/{{ fre_properties.INTEL }}.mk"
     modelRoot: ${HOME}/fremake_2025/c6_test

   - name: ncrc7.intel25
     compiler: intel
     envSetup: ["source $MODULESHOME/init/sh",
                "source /sw/gaea-c7/init/load_cpe.sh",
                "source /sw/gaea-c7/lmod-cpe/etc/profile",
                "module load {{ fre_properties.INTEL }}/2025.2",
                "module load cray-hdf5/1.14.3.7",
                "module load cray-netcdf/4.9.2.1",
                "module unload cray-libsci",
                "module use -a /ncrc/home2/fms/local/modulefiles",
                "module load fre/2026.01"]
     mkTemplate: "/ncrc/home2/fms/local/opt/fre-commands/bronx-23/site/ncrc7/{{ fre_properties.INTEL }}.mk"
     modelRoot: "/gpfs/f7/{{ fre_properties.GFDL_GROUP }}/scratch/${USER}/{{ fre_properties.FRE_STEM }}"

