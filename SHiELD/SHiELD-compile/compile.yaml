compile:
     experiment: shield
     container_addlibs: *containerLIBS
     baremetal_linkerflags: *baremetalLIBS
     src:
          - component: "FMS"
            repo: "https://github.com/NOAA-GFDL/FMS.git"
            cppdefs: "-Duse_libMPI -Duse_netCDF -Duse_LARGEFILE -DHAVE_SCHED_GETAFFINITY -DINTERNAL_FILE_NML -DGFS_PHYS -DGFS_CONSTANTS -DHAVE_GETTID" 
            branch: *fms_release
          - component: "SHiELD_physics"
            requires: ["FMS"]
            repo: "https://github.com/NOAA-GFDL/SHiELD_physics.git"
            branch: *phy_release
            paths: [SHiELD_physics/gsmphys,
                   SHiELD_physics/GFS_layer,
                   SHiELD_physics/IPD_layer]
            cppdefs: "-Duse_libMPI -Duse_netCDF -DHAVE_SCHED_GETAFFINITY -DSPMD -Duse_LARGEFILE -DGFS_PHYS -DUSE_GFSL63 -DNEW_TAUCTMAX -DNEMS_GSM -DINTERNAL_FILE_NML"
            otherFlags: *FMSincludes
          - component: "fv3"
            requires: ["FMS", "SHiELD_physics"]
            repo: "https://github.com/NOAA-GFDL/GFDL_atmos_cubed_sphere.git"
            cppdefs: "-Duse_libMPI -Duse_netCDF -DHAVE_SCHED_GETAFFINITY -DSPMD -Duse_LARGEFILE -DGFS_PHYS -DUSE_GFSL63 -DNEW_TAUCTMAX -DNEMS_GSM -DINTERNAL_FILE_NML"
            branch: *fv3_release
            paths: [SHiELD_physics/FV3GFS/,
                   fv3/tools/,
                   fv3/model/,
                   SHiELD_physics/atmos_shared/,
                   fv3/driver/SHiELD/atmosphere.F90]
            otherFlags: *FMSincludes
          - component: "driver"
            requires: ["FMS", "SHiELD_physics", "fv3"]
            repo: ["https://github.com/NOAA-GFDL/ocean_null.git",
                   "https://github.com/NOAA-GFDL/ice_null.git",
                   "https://github.com/NOAA-GFDL/ice_param",
                   "https://github.com/NOAA-GFDL/land_null.git",
                   "https://github.com/NOAA-GFDL/atmos_drivers.git",
                   "https://github.com/NOAA-GFDL/FMScoupler.git"]
            cppdefs: "-Duse_libMPI -Duse_netCDF -DHAVE_SCHED_GETAFFINITY -DSPMD -Duse_LARGEFILE -DGFS_PHYS -DUSE_GFSL63 -DNEW_TAUCTMAX -DNEMS_GSM -DINTERNAL_FILE_NML"
            branch: [*oceannull_release, *icenull_release, *iceparam_release, *landnull_release, *drivers_release,*coupler_release]
            paths: [driver/ocean_null/,
                    driver/ice_null/,
                    driver/ice_param/,
                    driver/land_null/,
                    driver/atmos_drivers/SHiELD/,
                    driver/FMScoupler/full/,
                    driver/FMScoupler/shared/]
            otherFlags: *FMSincludes
