fre_cli_version: "develop"

# reusable variables
fre_properties:
  VERSION:              "full"
  FRE_STEM:             "null_model/{{ fre_properties.VERSION }}"

  # Compile information
  BRANCH:               "main"
  INTEL:                "intel-classic"
  FMSincludes:          "-IFMS/include"
  VOLUME:               "/gpfs/f5"

  # Post-processing information
  EXP_START:          "19790101T0000Z"
  EXP_END:            "20200101T0000Z"
  ANA_START:          "1980"
  ANA_END:            "2020"
  PP_AMIP_CHUNK96:    "P1Y"
  PP_XYINTERP96:      "180,288"
  GRID_SPEC96:        "/archive/oar.gfdl.am5/model_gen5/inputs/c96_grid/c96_OM4_025_grid_No_mg_drag_v20160808.tar"

  # These can be defined in the settings.yaml but are included here to show an example of standard YAML tag usage (in settings.yaml)
  # Standard tags can include, but are not limited to (yaml docs: https://yaml.org/), !bool, !int, !float, etc.
  CLEAN_WORK:         True
  PLEVEL_MASKING:     True

build:
  compileYaml:  "compile.yaml"
  platformYaml: "../platforms.yaml"

experiments:
  null_model_full:
    settings: "settings.yaml"
    postprocess:
      - "postprocess.yaml"
    analysis:
      - "analysis.yaml"
